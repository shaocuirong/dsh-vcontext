[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-virtual-context"
version = "0.3.1"
description = "Transactional virtual context pages with a DeepSeek Harness adapter"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]

[project.scripts]
vcontext = "vcontext.cli:main"
vcontext-service = "vcontext.server:main"
vcontext-dashboard = "vcontext.dashboard:main"

[tool.setuptools.packages.find]
include = ["vcontext*"]
